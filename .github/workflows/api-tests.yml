name: Java tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        run: ./gradlew test --tests 'tests.unit.*' --tests 'learning.*'

      - name: Upload unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/allure-results/
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run API tests
        run: ./gradlew test --tests 'tests.api.*'

      - name: Upload API test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/allure-results/

  ui-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run UI tests
        run: ./gradlew test --tests 'tests.ui.*' -Dselenide.headless=true

      - name: Upload UI test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/allure-results/
            build/screenshots/**/*.png