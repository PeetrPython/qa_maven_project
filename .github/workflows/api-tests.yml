name: Java tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        run: mvn -B '-Dtest=tests.unit.*Test.learning.*Test' test

      - name: Upload unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: target/surefire-reports/
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run API tests
        run: mvn -B '-Dtest=tests.api.*Test' test

      - name: Upload API test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: target/surefire-reports/

  ui-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run UI tests
        run: mvn -B '-Dtest=tests.ui.*Test' -Dselenide.headless=true test

      - name: Upload UI test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports
          path: target/surefire-reports/